<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>63: Office Hell</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body.touch canvas { touch-action: none; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; display: block; }

  /* settings: a gear in the top-right corner that drops down the controls */
  #settings { position: fixed; top: 12px; right: 12px; z-index: 10; display: flex; flex-direction: column;
    align-items: flex-end; gap: 8px; }
  body.playing #settings { opacity: 0.35; transition: opacity 0.3s; }
  /* playing with a controller (Xbox): no cursor and no settings gear over the game */
  body.pad canvas { cursor: none; }
  body.pad.playing #settings { opacity: 0; pointer-events: none; }
  body.playing #settings:hover { opacity: 1; }
  #gearBtn {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid rgba(68, 218, 157, 0.55); cursor: pointer;
    background: rgba(24, 22, 40, 0.82); color: #44da9d; display: grid; place-items: center; padding: 0;
  }
  #gearBtn:hover { background: #383892; }
  #gearBtn svg { transition: transform 0.3s; }
  #settings.open #gearBtn svg { transform: rotate(60deg); }
  #sidebar {
    display: none; flex-direction: column; align-items: center; gap: 10px;
    padding: 12px 8px; border-radius: 14px;
    background: rgba(24, 22, 40, 0.92); border: 1px solid rgba(68, 218, 157, 0.55);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5); color: #44da9d;
  }
  #settings.open #sidebar { display: flex; }
  #sidebar button {
    width: 40px; height: 40px; border-radius: 10px; border: 0; cursor: pointer;
    background: #383892; color: #44da9d; display: grid; place-items: center; padding: 0;
  }
  #sidebar button:hover { background: #4a4ab8; }
  #sidebar button .off { display: none; }
  #sidebar button.muted { background: #3a2a30; color: #e63c32; }
  #sidebar button.muted .on { display: none; }
  #sidebar button.muted .off { display: block; }
  #sidebar input[type=range] {
    writing-mode: vertical-lr; direction: rtl; width: 22px; height: 110px;
    accent-color: #44da9d; cursor: pointer; margin: 0;
  }
  #sidebar .sep { width: 28px; height: 1px; background: rgba(68, 218, 157, 0.35); }
  #sidebar .label { font-size: 10px; letter-spacing: 0.05em; color: #b9b6d8; text-align: center; }

  /* restart button, shown once the game is won (the player can keep walking around) */
  #restartBtn {
    display: none; position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
    height: 40px; padding: 0 18px; border-radius: 10px; border: 1px solid rgba(68, 218, 157, 0.55); cursor: pointer;
    background: rgba(24, 22, 40, 0.82); color: #44da9d; font: 600 14px system-ui, sans-serif; letter-spacing: 0.08em;
  }
  #restartBtn:hover { background: #383892; }
  body.won #restartBtn { display: block; }

  /* phones and tablets: a thumb stick on the left, look by dragging on the right, buttons bottom-right */
  body.touch.playing #settings { opacity: 0; pointer-events: none; }
  #touch { display: none; position: fixed; inset: 0; z-index: 5; touch-action: none; }
  body.touch.playing #touch { display: block; }
  #touch button {
    position: absolute; border-radius: 50%; border: 2px solid rgba(68, 218, 157, 0.6); padding: 0;
    background: rgba(56, 56, 146, 0.38); color: #44da9d; font: 700 11px system-ui, sans-serif; letter-spacing: 0.06em;
    touch-action: none; -webkit-user-select: none; user-select: none;
  }
  #touch button.on { background: rgba(68, 218, 157, 0.45); color: #fff; }
  #tFire   { width: 86px; height: 86px; right: calc(22px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom));
             border-color: rgba(230, 60, 50, 0.75) !important; color: #ff8a80 !important; font-size: 13px !important; }
  #tFire.on { background: rgba(230, 60, 50, 0.5) !important; }
  #tJump   { width: 60px; height: 60px; right: calc(124px + env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); }
  #tUse    { width: 60px; height: 60px; right: calc(34px + env(safe-area-inset-right)); bottom: calc(130px + env(safe-area-inset-bottom)); }
  #tWeapon { width: 52px; height: 52px; right: calc(112px + env(safe-area-inset-right)); bottom: calc(100px + env(safe-area-inset-bottom)); }
  #tCrouch { width: 52px; height: 52px; right: calc(196px + env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom)); }
  /* top-right: the top-left of the view carries the game's messages */
  #tPause  { width: 44px; height: 44px; right: calc(12px + env(safe-area-inset-right)); top: calc(22px + env(safe-area-inset-top));
             border-radius: 10px !important; }
  #tBase, #tKnob { display: none; position: absolute; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); }
  #tBase { width: 110px; height: 110px; border: 2px solid rgba(68, 218, 157, 0.45); background: rgba(24, 22, 40, 0.3); }
  #tKnob { width: 50px; height: 50px; background: rgba(68, 218, 157, 0.55); }
  #touch.stick #tBase, #touch.stick #tKnob { display: block; }

  /* the game is landscape; ask phones held upright to turn */
  #rotate { display: none; position: fixed; inset: 0; z-index: 20; background: #000; color: #44da9d;
    flex-direction: column; align-items: center; justify-content: center; gap: 14px; font: 600 16px system-ui, sans-serif; text-align: center; }
  @media (orientation: portrait) { body.touch #rotate { display: flex; } }
</style>
<style>.lottie-animation-container{width:var(--lottie-animation-container-width);height:var(--lottie-animation-container-height);background-color:var(--lottie-animation-container-background-color);overflow:hidden;margin:var(--lottie-animation-margin)}.lottie-animation-container svg{transform:scale(var(--lottie-animation-scale))}</style><style>.lottie-animation-container{width:var(--lottie-animation-container-width);height:var(--lottie-animation-container-height);background-color:var(--lottie-animation-container-background-color);overflow:hidden;margin:var(--lottie-animation-margin)}.lottie-animation-container svg{transform:scale(var(--lottie-animation-scale))}</style></head>
<body class="">
<canvas id="screen" width="480" height="270" style="width: 1770px; height: 996px;"></canvas>

<button id="restartBtn" title="Restart (R)">RESTART</button>

<div id="touch">
  <div id="tBase"></div><div id="tKnob"></div>
  <button id="tPause" aria-label="Pause">❚❚</button>

  <button id="tUse" aria-label="Open doors">USE</button>
  <button id="tFire" aria-label="Fire">FIRE</button>
</div>

<div id="rotate">
  <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="7" y="2" width="10" height="20" rx="2"></rect><path d="M11 18h2"></path>
  </svg>
  <div>Turn your phone sideways to play</div>
</div>

<div id="settings">
<button id="gearBtn" title="Settings" aria-label="Settings" aria-expanded="false" aria-controls="sidebar">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="3"></circle>
    <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path>
  </svg>
</button>
<div id="sidebar" aria-label="Game settings">
  <button id="musicBtn" title="Music on (M)" aria-label="Toggle music">
    <svg class="on" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11 5 6 9H2v6h4l5 4V5z" fill="currentColor"></path>
      <path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 5a10 10 0 0 1 0 14"></path>
    </svg>
    <svg class="off" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11 5 6 9H2v6h4l5 4V5z" fill="currentColor"></path>
      <path d="m23 9-6 6"></path><path d="m17 9 6 6"></path>
    </svg>
  </button>
  <input id="musicVol" type="range" min="0" max="100" value="60" title="Music volume" aria-label="Music volume">
  <div class="label">MUSIC</div>
  <div class="sep"></div>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="7"></circle><path d="M12 2v5M12 17v5M2 12h5M17 12h5"></path>
  </svg>
  <input id="sens" type="range" min="30" max="200" value="100" title="Mouse sensitivity" aria-label="Mouse sensitivity">
  <div class="label"><span id="sensLbl">MOUSE</span><br><span id="sensVal">1.0x</span></div>
</div>
</div>
